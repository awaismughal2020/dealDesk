[project]
name = "dealdesk"
version = "0.1.0"
description = "Deal Desk MVP: brief to approved, costed proposal with a human in the loop (SAMPLE DATA ONLY)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - interview demo" }
dependencies = [
  "fastapi>=0.160,<0.163",
  "uvicorn>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "email-validator>=2.3,<3",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "pgvector>=0.5,<0.6",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "pypdf>=6.0,<8",
  "python-docx>=1.2,<2",
  "structlog>=26.1,<27",
  "argon2-cffi>=25.1,<26",
  "pyjwt[crypto]>=2.15,<3",
  "cryptography>=50,<51",
  "python-multipart>=0.0.33,<0.1",
  "httpx>=0.28,<0.29",
  "tenacity>=9.0,<10",
  "google-genai>=3.0,<4",
  "anthropic>=2.0,<3",
  "openai>=3.0,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.1,<8",
  "hypothesis>=6.170,<7",
  "mypy>=2.4,<3",
  "ruff>=0.17,<0.18",
  "import-linter>=2.16,<3",
  "pip-audit>=2.10,<3",
  "pre-commit>=4,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealdesk"]

[tool.uv]
# Reproducibility: never resolve packages published after this instant (see docs/adr/0012).
exclude-newer = "2026-11-08T00:00:00Z"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evals"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "C90", "RUF", "PL", "ANN", "D",
  "PT", "RET", "ARG", "PTH", "ERA", "BLE", "TRY", "DTZ", "T20", "A", "C4", "ISC",
  "PIE", "PERF", "FBT", "TID",
]
ignore = [
  "D100", "D104", "D105", "D107", "D203", "D213",
  "TRY003",   # explicit messages on typed exceptions are fine
  "PLR0913",  # FastAPI dependencies need many params
  "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6

[tool.ruff.lint.isort]
known-first-party = ["dealdesk", "scripts", "evals", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Path", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "ANN", "PLR2004", "FBT", "ARG", "S311", "PLC0415", "SLF001"]
"evals/**" = ["T20", "D", "S101"]
"scripts/**" = ["T20", "D"]
"migrations/**" = ["D", "ANN"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["dealdesk"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs a real Postgres (DATABASE_URL)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:langgraph.*", "ignore::DeprecationWarning:langchain_core.*"]

[tool.coverage.run]
branch = true
source = ["dealdesk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.$",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["dealdesk"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no frameworks, no I/O libraries, no outer layers"
type = "forbidden"
source_modules = ["dealdesk.domain"]
forbidden_modules = [
  "dealdesk.application", "dealdesk.ports", "dealdesk.adapters", "dealdesk.api", "dealdesk.auth",
  "dealdesk.config", "fastapi", "sqlalchemy", "langgraph", "psycopg", "pydantic", "pydantic_settings",
  "google", "anthropic", "openai", "httpx", "docx", "pypdf", "structlog",
]

[[tool.importlinter.contracts]]
name = "Ports depend only on the domain"
type = "forbidden"
source_modules = ["dealdesk.ports"]
forbidden_modules = [
  "dealdesk.application", "dealdesk.adapters", "dealdesk.api", "fastapi", "sqlalchemy",
  "langgraph", "psycopg", "google", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Application depends on domain and ports, never on adapters, API or SDKs"
type = "forbidden"
source_modules = ["dealdesk.application"]
forbidden_modules = [
  "dealdesk.adapters", "dealdesk.api", "fastapi", "sqlalchemy", "psycopg",
  "google", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Adapters never import the API layer"
type = "forbidden"
source_modules = ["dealdesk.adapters"]
forbidden_modules = ["dealdesk.api"]
