name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, unit + integration tests, coverage (Python + TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Generate local-only secrets (.env, signing keys)
        run: make init
      - name: make check
        run: make check
      - name: Evals (offline, recorded FakeLLM fixtures)
        run: make eval

  e2e:
    name: Playwright + axe against the Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: make init
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
      - if: always()
        run: make down

  iac:
    name: Terraform fmt/validate + Helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make tf-validate
      - run: make helm-lint

  images:
    name: Build images + scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t dealdesk-api:ci .
      - run: docker build --target runtime -t dealdesk-web:ci web
      # Vulnerabilities only: Trivy's secret rules flag documentation strings inside third-party
      # SDKs; secrets in this repository are scanned by gitleaks (audit job).
      - name: Scan images (Trivy, fails on HIGH/CRITICAL with a fix available)
        run: |
          for img in dealdesk-api:ci dealdesk-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
              image --scanners vuln --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$img"
          done

  audit:
    name: Dependency audit + secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make init
      - run: make audit
      - run: make secrets-scan
