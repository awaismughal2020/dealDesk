# Images are pinned by digest in real deployments.
image:
  api:
    repository: ghcr.io/example/dealdesk-api
    tag: "0.1.0"
    digest: ""
  web:
    repository: ghcr.io/example/dealdesk-web
    tag: "0.1.0"
    digest: ""
  pullPolicy: IfNotPresent

# Name of an existing Secret (created outside Helm) with keys:
#   DATABASE_URL; "current.pem" (Ed25519 signing key, local auth mode only; a single key is used
#   as the active key); optional ANTHROPIC_API_KEY / OPENAI_API_KEY.
existingSecret: dealdesk-secrets

config:
  appEnv: production
  authMode: oidc
  allowedOrigins: https://dealdesk.example.org
  llmProvider: fake
  llmModel: fake-deterministic-v1
  embeddingProvider: fake
  logLevel: INFO
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    clientId: ""
    authorizeUrl: ""
    tokenUrl: ""

api:
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

web:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

migrations:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: dealdesk.example.org
  # TLS placeholder: point at a certificate Secret managed by cert-manager or your platform.
  tlsSecretName: dealdesk-tls
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
