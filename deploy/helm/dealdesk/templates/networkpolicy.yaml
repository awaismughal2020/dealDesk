{{- if .Values.networkPolicy.enabled }}
# The API accepts traffic only from the web pods. Egress to the database and model provider is
# left to platform policy (it depends on where Postgres and the provider live).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dealdesk.fullname" . }}-api
  labels:
    {{- include "dealdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dealdesk.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dealdesk.selector" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - port: {{ .Values.api.port }}
{{- end }}
