apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dealdesk.fullname" . }}-config
  labels:
    {{- include "dealdesk.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  COOKIE_SECURE: "true"
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  JWT_KEYS_DIR: /run/dealdesk-keys
  OIDC_ISSUER: {{ .Values.config.oidc.issuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidc.audience | quote }}
  OIDC_JWKS_URL: {{ .Values.config.oidc.jwksUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.oidc.clientId | quote }}
  OIDC_AUTHORIZE_URL: {{ .Values.config.oidc.authorizeUrl | quote }}
  OIDC_TOKEN_URL: {{ .Values.config.oidc.tokenUrl | quote }}
  API_INTERNAL_URL: {{ printf "http://%s-api:%v" (include "dealdesk.fullname" .) .Values.api.port | quote }}
